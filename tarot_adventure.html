        // ==========================================
        // 2. FEMININE & MYSTERIOUS AMBIENT SOUND ENGINE
        // ==========================================
        class AmbientSoundEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = true;
                this.padTimer = null;
                this.bellTimer = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            toggleSound() {
                this.init();
                this.isMuted = !this.isMuted;
                if (!this.isMuted) {
                    this.startAmbientSoundscape();
                } else {
                    this.stopAmbientSoundscape();
                }
                return !this.isMuted;
            }

            playSoftTone(freq, duration = 3, vol = 0.05) {
                if (this.isMuted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                    gain.gain.setValueAtTime(0, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + duration * 0.3);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }

            playChime(freq) {
                if (this.isMuted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 2.5);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 2.5);
                } catch(e){}
            }

            startAmbientSoundscape() {
                if (this.padTimer) clearInterval(this.padTimer);
                if (this.bellTimer) clearInterval(this.bellTimer);

                const padScale = [185.00, 220.00, 277.18, 329.63, 370.00];
                const chimeScale = [740.00, 880.00, 1108.73, 1318.51, 1479.98];

                let step = 0;
                this.padTimer = setInterval(() => {
                    if (this.isMuted || !this.ctx) return;
                    const f1 = padScale[step % padScale.length];
                    const f2 = padScale[(step + 2) % padScale.length];
                    this.playSoftTone(f1, 5, 0.04);
                    this.playSoftTone(f2, 6, 0.03);
                    step++;
                }, 3500);

                this.bellTimer = setInterval(() => {
                    if (this.isMuted || !this.ctx) return;
                    if (Math.random() > 0.3) {
                        const chimeFreq = chimeScale[Math.floor(Math.random() * chimeScale.length)];
                        this.playChime(chimeFreq);
                    }
                }, 4200);
            }

            stopAmbientSoundscape() {
                if (this.padTimer) clearInterval(this.padTimer);
                if (this.bellTimer) clearInterval(this.bellTimer);
                this.padTimer = null;
                this.bellTimer = null;
            }

            playCardFlipSound() {
                this.playChime(1108.73);
            }

            playFanfare() {
                [554.37, 659.25, 830.61, 1108.73].forEach((f, i) => {
                    setTimeout(() => this.playChime(f), i * 180);
                });
            }
        }

            sound.playChime(880.00);
            state.selectedOption = optText;
            state.step = 'SELECT_SPREAD';
            render();
        }

        // --- STEP 3: SPREAD SELECTION ---
        function renderSpreadSelection(container) {
            container.innerHTML = `
                <div class="text-center space-y-3 mb-8">
                    <button onclick="state.step='SELECT_OPTION'; render();" class="text-xs text-purple-300 hover:text-mystic-gold underline mb-2 block mx-auto">
                        ← 願いごとを選びなおす
                    </button>
                    <span class="px-4 py-1 rounded-full bg-mystic-gold/10 border border-mystic-gold/30 text-mystic-gold text-xs tracking-widest">
                        <ruby>第三章<rt>だいさんしょう</rt></ruby>：<ruby>展開法<rt>てんかいほう</rt></ruby>（スプレッド）
                    </span>
                    <h2 class="text-2xl md:text-3xl font-bold text-mystic-gold">
                        カードの<ruby>陣立<rt>じんだ</rt></ruby>てをお選びください
                    </h2>
                    <p class="text-xs md:text-sm text-purple-200">
                        何枚のタロットが、あなたの<ruby>運命<rt>うんめい</rt></ruby>を紐解(ひもと)くでしょう。
                    </p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
                    ${Object.entries(SPREADS).map(([key, spread]) => `
                        <button onclick="selectSpread(${key})" class="bg-mystic-900/90 hover:bg-mystic-800 border border-purple-500/30 hover:border-mystic-gold p-5 rounded-2xl text-left transition duration-300 shadow-xl flex flex-col justify-between group">
                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <h3 class="text-sm font-bold text-mystic-gold group-hover:text-white">${spread.rubyName}</h3>
                                    <span class="bg-mystic-800 text-mystic-rose text-[10px] px-2.5 py-1 rounded-full border border-mystic-rose/30">${spread.cards}枚引き</span>
                                </div>
                                <p class="text-xs text-purple-300 leading-relaxed mb-4">${spread.desc}</p>
                            </div>
                            <div class="text-right text-xs font-semibold text-mystic-gold">この<ruby>陣立<rt>じんだ</rt></ruby>てで占う ➔</div>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function selectSpread(cardsCount) {
            sound.playChime(1108.73);
            state.selectedSpread = SPREADS[cardsCount];
            state.step = 'RITUAL';
            render();
        }

        // --- STEP 4: SHUFFLE RITUAL ---
        function renderRitualPhase(container) {
            container.innerHTML = `
                <div class="text-center space-y-3 mb-6">
                    <span class="px-4 py-1 rounded-full bg-mystic-gold/10 border border-mystic-gold/30 text-mystic-gold text-xs tracking-widest">
                        <ruby>第四章<rt>だいよんしょう</rt></ruby>：<ruby>魂<rt>たましい</rt></ruby>のシャッフル
                    </span>
                    <h2 class="text-2xl md:text-3xl font-bold text-mystic-gold">
                        カードに<ruby>想<rt>おも</rt></ruby>いを込めて
                    </h2>
                    <p class="text-xs md:text-sm text-purple-200">
                        ボタンを押してカードを混(ま)ぜ合わせ、あなたの波長(はちょう)と重ね合わせましょう。
                    </p>
                </div>

                <div class="bg-mystic-900/90 border border-mystic-gold/40 p-8 rounded-3xl w-full max-w-lg text-center shadow-2xl flex flex-col items-center">
                    <div id="deck-area" class="relative w-40 h-56 my-4 flex items-center justify-center">
                        <div id="card-stack-3" class="absolute w-36 h-52 transition-transform duration-500 transform translate-x-3 translate-y-3">
                            ${getCardSVG({}, false)}
                        </div>
                        <div id="card-stack-2" class="absolute w-36 h-52 transition-transform duration-500 transform translate-x-1.5 translate-y-1.5">
                            ${getCardSVG({}, false)}
                        </div>
                        <div id="card-stack-1" class="absolute w-36 h-52 transition-transform duration-500">
                            ${getCardSVG({}, false)}
                        </div>
                    </div>

                    <p id="ritual-hint" class="text-xs text-mystic-gold font-semibold mb-6 h-6">
                        「シャッフル」を押して、星の導きを呼び寄せましょう。
                    </p>

                    <div class="flex space-x-4 w-full justify-center">
                        <button id="shuffle-btn" onclick="performShuffle()" class="px-6 py-3 rounded-full bg-mystic-800 hover:bg-mystic-700 text-mystic-gold font-bold text-xs shadow-lg border border-mystic-gold/50 transition">
                            🔀 カードを洗う (シャッフル)
                        </button>
                        <button id="draw-btn" onclick="finishRitual()" disabled class="px-6 py-3 rounded-full bg-gray-800 text-gray-500 font-bold text-xs opacity-50 cursor-not-allowed shadow-lg border border-gray-700 transition">
                            ✨ 運命のカードを引く
                        </button>
                    </div>
                </div>
            `;
        }

        let shuffleTimes = 0;
        function performShuffle() {
            sound.playSoftTone(300 + Math.random() * 200, 1.5);
            shuffleTimes++;

            const stack1 = document.getElementById('card-stack-1');
            const stack2 = document.getElementById('card-stack-2');
            const hint = document.getElementById('ritual-hint');

            stack1.classList.add('-translate-x-12', 'rotate-12');
            stack2.classList.add('translate-x-12', '-rotate-12');

            setTimeout(() => {
                stack1.classList.remove('-translate-x-12', 'rotate-12');
                stack2.classList.remove('translate-x-12', '-rotate-12');
            }, 350);

            if (shuffleTimes >= 2) {
                hint.innerHTML = "星の準備が整いました。「運命のカードを引く」を押してください。";
                const drawBtn = document.getElementById('draw-btn');
                drawBtn.disabled = false;
                drawBtn.className = "px-6 py-3 rounded-full bg-mystic-gold hover:bg-yellow-300 text-mystic-950 font-bold text-xs shadow-xl border border-yellow-200 transition glow-gold cursor-pointer";
            } else {
                hint.innerHTML = "もう一度シャッフルして、心を澄ませましょう。";
            }
        }

        function finishRitual() {
            sound.playFanfare();
            const shuffled = [...TAROT_DECK].sort(() => Math.random() - 0.5);
            
            state.drawnCards = shuffled.slice(0, state.selectedSpread.cards).map(card => ({
                card: card,
                isReversed: Math.random() < 0.25
            }));

            state.currentExploreIdx = 0;
            state.step = 'EXPLORE';
            render();
        }

        // --- STEP 5: DEEP CARD EXPLORATION ---
        function renderCardExploration(container) {
            const currentItem = state.drawnCards[state.currentExploreIdx];
            const card = currentItem.card;
            const isReversed = currentItem.isReversed;
            const spreadInfo = state.selectedSpread;
            const posTitle = spreadInfo.rubyPositions ? spreadInfo.rubyPositions[state.currentExploreIdx] : `第 ${state.currentExploreIdx + 1} の星`;

            container.innerHTML = `
                <div class="text-center space-y-2 mb-4">
                    <span class="px-4 py-1 rounded-full bg-mystic-gold/10 border border-mystic-gold/30 text-mystic-gold text-xs tracking-widest">
                        第 ${state.currentExploreIdx + 1} / ${spreadInfo.cards} の<ruby>開眼<rt>かいげん</rt></ruby>
                    </span>
                    <h2 class="text-xl md:text-2xl font-bold text-mystic-gold">${posTitle}</h2>
                </div>

                <div class="flex flex-col md:flex-row items-center justify-center gap-8 w-full max-w-3xl">
                    <div class="card-container w-52 h-80 md:w-60 md:h-92 flex-shrink-0 cursor-pointer" onclick="flipCurrentCard()">
                        <div id="card-inner-element" class="card-inner w-full h-full relative rounded-2xl shadow-2xl">
                            <div class="card-front absolute inset-0 w-full h-full">
                                ${getCardSVG({}, false)}
                            </div>
                            <div class="card-back absolute inset-0 w-full h-full">
                                ${getCardSVG(card, true, isReversed)}
                            </div>
                        </div>
                    </div>

                    <div class="bg-mystic-900/90 border border-mystic-gold/40 rounded-3xl p-6 flex-grow text-left space-y-4 shadow-2xl w-full">
                        <div class="flex items-center justify-between border-b border-purple-900/40 pb-2">
                            <span class="text-xs font-bold text-mystic-gold bg-mystic-800 px-3 py-1 rounded-full border border-mystic-gold/30">
                                象徴: ${card.rubyKeyword}
                            </span>
                            <span class="text-[10px] text-purple-300">タップで反転します</span>
                        </div>

                        <div>
                            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                <span>${card.emblem}</span> ${card.rubyName}
                            </h3>
                            <p class="text-xs md:text-sm text-mystic-goldlight font-semibold mt-1">
                                ${isReversed ? '【<ruby>逆位置<rt>ぎゃくいち</rt></ruby>の<ruby>暗示<rt>あんじ</rt></ruby>】' + card.meaning + '（少し注意深く過ごすことで好転します）' : '【<ruby>正位置<rt>せいいち</rt></ruby>の<ruby>暗示<rt>あんじ</rt></ruby>】' + card.meaning}
                            </p>
                        </div>

                        <div class="bg-mystic-950/70 p-4 rounded-2xl border border-purple-900/40">
                            <p class="text-xs md:text-sm text-purple-200 leading-relaxed">
                                📜 <strong><ruby>星<rt>ほし</rt></ruby>からの告げ：</strong><br>
                                ${card.detail}
                            </p>
                        </div>

                        <div class="pt-2 flex justify-between items-center">
                            <button onclick="prevCard()" ${state.currentExploreIdx === 0 ? 'disabled class="opacity-30 cursor-not-allowed text-xs text-purple-400"' : 'class="text-xs text-mystic-gold hover:underline font-semibold"'}>
                                ⬅ 前のカードへ
                            </button>

                            ${state.currentExploreIdx < spreadInfo.cards - 1 ? `
                                <button onclick="nextCard()" class="px-5 py-2.5 rounded-full bg-mystic-800 hover:bg-mystic-700 text-mystic-gold text-xs font-bold shadow border border-mystic-gold/40">
                                    次のカードへ ➔
                                </button>
                            ` : `
                                <button onclick="goToSummary()" class="px-6 py-2.5 rounded-full bg-mystic-gold hover:bg-yellow-300 text-mystic-950 text-xs font-bold shadow-xl border border-yellow-200 glow-gold">
                                    <ruby>総合診断<rt>そうごうしんだん</rt></ruby>へ進む 🌟
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                const el = document.getElementById('card-inner-element');
                if (el && !el.classList.contains('is-flipped')) {
                    sound.playCardFlipSound();
                    el.classList.add(isReversed ? 'is-reversed' : 'is-flipped');
                }
            }, 300);
        }

        function flipCurrentCard() {
            const el = document.getElementById('card-inner-element');
            if (el) {
                sound.playCardFlipSound();
                const item = state.drawnCards[state.currentExploreIdx];
                if (el.classList.contains('is-flipped') || el.classList.contains('is-reversed')) {
                    el.classList.remove('is-flipped', 'is-reversed');
                } else {
                    el.classList.add(item.isReversed ? 'is-reversed' : 'is-flipped');
                }
            }
        }

        function prevCard() {
            if (state.currentExploreIdx > 0) {
                state.currentExploreIdx--;
                render();
            }
        }

        function nextCard() {
            if (state.currentExploreIdx < state.selectedSpread.cards - 1) {
                state.currentExploreIdx++;
                render();
            }
        }

        function goToSummary() {
            sound.playFanfare();
            state.step = 'SUMMARY';
            render();
        }

        // --- STEP 6: COMPREHENSIVE FINAL DIAGNOSIS WITH FULL RUBY & DETAILED CARD RECAP ---
        function renderSummary(container) {
            const drawnItems = state.drawnCards;
            const category = state.selectedCategory;
            const option = state.selectedOption;

            container.innerHTML = `
                <div class="text-center space-y-3 mb-6">
                    <span class="px-4 py-1 rounded-full bg-mystic-gold/10 border border-mystic-gold/30 text-mystic-gold text-xs tracking-widest">
                        <ruby>最終章<rt>さいしゅうしょう</rt></ruby>：<ruby>運命<rt>うんめい</rt></ruby>の<ruby>全貌<rt>ぜんぼう</rt></ruby>
                    </span>
                    <h2 class="text-2xl md:text-3xl font-bold text-mystic-gold">
                        🔮 <ruby>全体<rt>ぜんたい</rt></ruby>の<ruby>物語<rt>ものがたり</rt></ruby>と<ruby>総合診断結果<rt>そうごうしんだんけっか</rt></ruby>
                    </h2>
                    <p class="text-xs md:text-sm text-purple-300">
                        <ruby>星詠<rt>ほしよ</rt></ruby>みの<ruby>館<rt>やかた</rt></ruby>が<ruby>授<rt>さず</rt></ruby>ける、あなただけの<ruby>未来<rt>みらい</rt></ruby>の<ruby>道<rt>みち</rt></ruby>しるべです。
                    </p>
                </div>

                <div class="bg-mystic-900/95 border-2 border-mystic-gold/40 rounded-3xl p-6 md:p-8 w-full max-w-3xl shadow-2xl space-y-8">
                    <!-- Query Recap with Ruby -->
                    <div class="bg-mystic-950/80 p-4 rounded-2xl border border-purple-900/40 flex flex-col md:flex-row justify-between items-center gap-2">
                        <div>
                            <span class="text-xs text-purple-400"><ruby>問<rt>と</rt></ruby>いかけた<ruby>物語<rt>ものがたり</rt></ruby>：${category.icon} ${category.title}</span>
                            <h4 class="text-xs md:text-sm font-bold text-mystic-gold mt-1">「${option}」</h4>
                        </div>
                        <span class="bg-mystic-800 text-mystic-rose text-xs px-3 py-1 rounded-full border border-mystic-rose/30">
                            ${state.selectedSpread.rubyName} (${drawnItems.length}枚)
                        </span>
                    </div>

                    <!-- Master Dynamic Emblem -->
                    <div class="text-center py-2">
                        <p class="text-xs text-mystic-gold font-bold mb-3 tracking-widest">
                            ✨ あなたの<ruby>運命<rt>うんめい</rt></ruby>を<ruby>束<rt>たば</rt></ruby>ねる「<ruby>守護<rt>しゅご</rt></ruby>の<ruby>紋章<rt>もんしょう</rt></ruby>」 ✨
                        </p>
                        ${generateMasterEmblemSVG(drawnItems)}
                    </div>

                    <!-- Comprehensive Narrative Synthesis with Ruby -->
                    <div class="space-y-4 bg-mystic-800/50 p-6 rounded-2xl border border-mystic-gold/30">
                        <h3 class="text-base font-bold text-mystic-gold flex items-center gap-2 border-b border-mystic-gold/20 pb-2">
                            <span>🌙</span> <ruby>星詠<rt>ほしよ</rt></ruby>みの<ruby>魔女<rt>まじょ</rt></ruby>より<ruby>贈<rt>おく</rt></ruby>る<ruby>言葉<rt>ことば</rt></ruby>
                        </h3>
                        <p class="text-xs md:text-sm text-purple-100 leading-loose">
                            引き寄せられたカードの中で、特に強く輝いているのは<strong>「${drawnItems[0].card.rubyName}（${drawnItems[0].card.rubyKeyword}）」</strong>です。<br>
                            ${drawnItems.map(item => item.card.meaning).join(' ')}<br>
                            <ruby>恐<rt>おそ</rt></ruby>れることは何もありません。あなたの<ruby>心<rt>こころ</rt></ruby>の中にある<ruby>素直<rt>すなお</rt></ruby>な<ruby>優<rt>やさ</rt></ruby>しさと<ruby>決意<rt>けつい</rt></ruby>が、<ruby>最高<rt>さいこう</rt></ruby>の<ruby>未来<rt>みらい</rt></ruby>を引き寄せる<ruby>鍵<rt>かぎ</rt></ruby>となるでしょう。
                        </p>
                    </div>

                    <!-- EVERY CARD SHOWCASE WITH DETAILED EXPLANATION AND RUBY -->
                    <div>
                        <h4 class="text-sm font-bold text-mystic-gold mb-4 text-center tracking-widest">
                            📜 <ruby>巡<rt>めぐ</rt></ruby>りあわせたすべてのカードと<ruby>導<rt>みちび</rt></ruby>き
                        </h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${drawnItems.map((item, i) => `
                                <div class="bg-mystic-950/90 p-5 rounded-2xl border border-purple-800/40 flex flex-col space-y-3 hover:border-mystic-gold/60 transition shadow-lg">
                                    <div class="flex items-center justify-between">
                                        <span class="text-[10px] text-mystic-rose font-bold px-2.5 py-1 rounded-full bg-mystic-900 border border-mystic-rose/30">
                                            ${state.selectedSpread.rubyPositions ? state.selectedSpread.rubyPositions[i] : `位置 ${i+1}`}
                                        </span>
                                        <span class="text-[10px] text-purple-300">
                                            ${item.isReversed ? '【<ruby>逆位置<rt>ぎゃくいち</rt></ruby>】' : '【<ruby>正位置<rt>せいいち</rt></ruby>】'}
                                        </span>
                                    </div>
                                    
                                    <div class="flex items-center gap-4">
                                        <!-- Card Image Thumbnail -->
                                        <div class="w-20 h-32 flex-shrink-0">
                                            ${getCardSVG(item.card, true, item.isReversed)}
                                        </div>
                                        <div class="flex-grow space-y-1">
                                            <h5 class="text-sm font-bold text-mystic-gold flex items-center gap-1">
                                                <span>${item.card.emblem}</span> ${item.card.rubyName}
                                            </h5>
                                            <p class="text-[11px] font-semibold text-purple-200">
                                                ${item.card.rubyKeyword}
                                            </p>
                                            <p class="text-[10px] text-purple-300/90 leading-tight">
                                                ${item.card.meaning}
                                            </p>
                                        </div>
                                    </div>

                                    <!-- Detailed Explanation for each card -->
                                    <div class="bg-mystic-900/60 p-3 rounded-xl border border-purple-900/30 text-[11px] text-purple-100 leading-relaxed">
                                        💡 <strong><ruby>解説<rt>かいせつ</rt></ruby>とアドバイス：</strong><br>
                                        ${item.card.detail}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Final Action Buttons -->
                    <div class="flex justify-center pt-4 border-t border-purple-900/40">
                        <button onclick="restartJourney()" class="px-8 py-3.5 rounded-full bg-gradient-to-r from-mystic-gold via-yellow-300 to-mystic-gold text-mystic-950 font-bold text-xs tracking-widest shadow-xl border border-yellow-100 transition glow-gold hover:scale-105">
                            🔄 もう一度、<ruby>運命<rt>うんめい</rt></ruby>の<ruby>扉<rt>とびら</rt></ruby>をひらく
                        </button>
                    </div>
                </div>
            `;
        }

        function restartJourney() {
            sound.playSoftTone(523.25, 1.5);
            state.step = 'INTRO';
            state.selectedCategory = null;
            state.selectedOption = null;
            state.selectedSpread = null;
            state.drawnCards = [];
            state.currentExploreIdx = 0;
            render();
        }

        // ==========================================
        // 6. INITIALIZATION
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            render();

            document.getElementById('sound-btn').addEventListener('click', () => {
                const isPlaying = sound.toggleSound();
                document.getElementById('sound-icon').innerText = isPlaying ? '🌙' : '🔇';
                document.getElementById('sound-text').innerHTML = isPlaying 
                    ? '<ruby>神秘<rt>しんぴ</rt></ruby>の<ruby>音色<rt>ねいろ</rt></ruby> ON' 
                    : '<ruby>神秘<rt>しんぴ</rt></ruby>の<ruby>音色<rt>ねいろ</rt></ruby> OFF';
            });
        });
    </script>
</body>
</html>
